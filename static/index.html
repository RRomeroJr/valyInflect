<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValyInflect</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Sidebar -->
<div id="practiceToolbar" class="sidebar">
    <h3 id="practice-toolbar-title">Practice Filters</h3>
    <div class="filter-container">
        <div class="filter-section">
            <h4>Word Type</h4>
            <div class="button-group" data-category="wordType">
                <button class="filter-btn" data-value="noun">Noun</button>
                <button class="filter-btn" data-value="adjective">Adjective</button>
            </div>
        </div>
    </div>
    <div class="button-group">
        <a class="info-btn" href="https://github.com/RRomeroJr/valyInflect">GitHub</a>
        <button class="info-btn vl-localization-toggle">Drējos?</button>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="quiz-area">
        <h1 class="main-title">🐉 Project: ValyInflect</h1>
        <!-- <h1>Rīnilaksir: ValyInflect<br>🐉</h1> -->
        <!-- <h1>🐉Verdilaksir: ValyInflect</h1> -->
        <p class="main-details">Now with less prescience</p>
        <button id="startQuizBtn">Start Quiz</button>
        <div id="quizDisplay" class="word-display" style="display: none;">
            <div id="questionText" class="word"></div>
            
            <div class="input-section">
                <input type="text" id="answerInput" placeholder="Enter your answer..." />
                <button id="submitBtn">Submit Answer</button>
            </div>
                
                <div id="feedback" class="feedback" style="display: none;"></div>
                
                <button id="nextQuestionBtn" style="display: none;">Next Question</button>
                <div id="questionDetails" class="details"></div>

            </div>
            
            <div id="loading" class="loading" style="display: none;">
                Loading...
            </div>
        </div>
    </div>
</div>

<script type="module" src="main.js?v=1.0"></script>
</body>
</html>
